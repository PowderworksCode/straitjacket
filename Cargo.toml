[package]
name = "straitjacket"
version = "0.1.3"
edition = "2024"
description = "A fast, deterministic scanner that flags the weird code and text LLMs produce."
license = "MIT"
repository = "https://github.com/PowderworksCode/straitjacket"
homepage = "https://straitjacket.dev"
documentation = "https://straitjacket.dev/docs"
readme = "README.md"
keywords = ["linter", "llm", "ai", "static-analysis", "ci"]
categories = ["development-tools", "command-line-utilities"]
exclude = ["assets/*", "site/*", "notes/*"]

[[bin]]
name = "straitjacket"
path = "src/main.rs"

[lib]
name = "straitjacket"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
inventory = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
unic-emoji-char = "0.9"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
let_underscore_must_use = "deny"

[profile.release]
lto = true
strip = true

[package.metadata.cratebank]
public = true
repository = "https://github.com/PowderworksCode/straitjacket"
