# straitjacket-allow-file:no-comments — a manifest is interface, read by anyone
# deciding whether to trust this dependency list, and TOML has no
# documentation-comment syntax to hoist the reasoning into. The blake3 entry in
# particular has to explain itself here: it looks unused, and removing it breaks
# only the aarch64 release.
[package]
name = "straitjacket"
version = "0.1.3"
edition = "2024"
description = "A fast, deterministic scanner that flags the weird code and text LLMs produce."
license = "MIT"
repository = "https://github.com/PowderworksCode/straitjacket"
homepage = "https://straitjacket.dev"
documentation = "https://straitjacket.dev/docs"
readme = "README.md"
keywords = ["linter", "llm", "ai", "static-analysis", "ci"]
categories = ["development-tools", "command-line-utilities"]
exclude = ["assets/*", "site/*", "notes/*"]

[[bin]]
name = "straitjacket"
path = "src/main.rs"

[lib]
name = "straitjacket"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
wasmer = { version = "7", default-features = false, features = ["sys", "cranelift"] }
# Not used directly. wasmer pulls blake3, whose build.rs compiles NEON assembly
# with cc on aarch64 -- which needs `aarch64-linux-musl-gcc` and so breaks the
# aarch64 musl release build that .cargo/config.toml exists to make possible.
# `pure` selects the Rust implementation instead, and naming blake3 here is what
# unifies that feature across the whole graph.
blake3 = { version = "1", default-features = false, features = ["pure"] }
beamte = { git = "https://github.com/PowderworksCode/beamte" }
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
inventory = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
unic-emoji-char = "0.9"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
let_underscore_must_use = "deny"

[profile.release]
lto = true
strip = true
