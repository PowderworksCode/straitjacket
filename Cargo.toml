[package]
name = "straitjacket"
version = "0.1.1"
edition = "2024"
description = "An opinionated source scanner with deterministic findings for CI."
license = "MIT"
repository = "https://github.com/PowderworksCode/straitjacket"
readme = "README.md"
exclude = ["assets/*"]

[[bin]]
name = "straitjacket"
path = "src/main.rs"

[lib]
name = "straitjacket"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
inventory = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
unic-emoji-char = "0.9"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
let_underscore_must_use = "deny"

[profile.release]
lto = true
strip = true
