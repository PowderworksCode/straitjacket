# straitjacket-allow-file:no-comments — an action definition is interface, read
# by people wiring it into a workflow, and YAML has no documentation-comment
# syntax to hoist the reasoning into.
name: Straitjacket
description: Scan a repository with Straitjacket and fail the build on findings.
author: Powderworks

branding:
  icon: alert-octagon
  color: red

inputs:
  version:
    description: Release tag to install, such as v0.1.0, or `latest`.
    required: false
    default: latest
  paths:
    description: >-
      Files or directories to scan. Accepts one per line or several on one line.
    required: false
    default: "."
  only:
    description: >-
      Run only these rules. Accepts one per line or a comma-separated list.
    required: false
    default: ""
  skip:
    description: >-
      Disable these rules. Accepts one per line or a comma-separated list.
    required: false
    default: ""
  format:
    description: Output format written to the log — `text`, `json`, or `sarif`.
    required: false
    default: text
  max-lines:
    description: Maximum lines per file. `0` disables the `file-size` rule.
    required: false
    default: ""
  max-nesting:
    description: Maximum indentation depth. `0` disables the `deep-nesting` rule.
    required: false
    default: ""
  no-comments:
    description: Enable the opt-in `no-comments` rule.
    required: false
    default: "false"
  include-json:
    description: Scan JSON files, which are skipped by default.
    required: false
    default: "false"
  no-ignore:
    description: Scan files that .gitignore, .ignore, and the hidden-file convention exclude.
    required: false
    default: "false"
  config:
    description: Use this configuration file instead of discovering one.
    required: false
    default: ""
  no-config:
    description: Ignore checked-in configuration.
    required: false
    default: "false"
  sarif-file:
    description: Write a SARIF report to this path. Empty writes none.
    required: false
    default: ""
  fail-on-findings:
    description: Fail the step when there are error-level findings.
    required: false
    default: "true"
  fail-on-unused-markers:
    description: Report suppression markers that suppress nothing.
    required: false
    default: "true"
  token:
    description: >-
      Token used to download the release. Needed only while the Straitjacket
      repository is private; a public release needs none.
    required: false
    default: ""

outputs:
  exit-code:
    description: The straitjacket exit code — 0 clean, 1 findings, 2 operational failure.
    value: ${{ steps.scan.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Install straitjacket
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        STRAITJACKET_INSTALL_DIR: ${{ runner.temp }}/straitjacket-bin
        GITHUB_TOKEN: ${{ inputs.token }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -eu
        if [ "$VERSION" != "latest" ]; then
          export STRAITJACKET_VERSION="$VERSION"
        fi
        sh "${ACTION_PATH}/install.sh"
        echo "$STRAITJACKET_INSTALL_DIR" >> "$GITHUB_PATH"

    # Inputs reach the script through the environment rather than through
    # expression interpolation, so a value containing shell syntax is an
    # argument and never a command.
    - name: Run straitjacket
      id: scan
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
        ONLY: ${{ inputs.only }}
        SKIP: ${{ inputs.skip }}
        FORMAT: ${{ inputs.format }}
        MAX_LINES: ${{ inputs.max-lines }}
        MAX_NESTING: ${{ inputs.max-nesting }}
        NO_COMMENTS: ${{ inputs.no-comments }}
        INCLUDE_JSON: ${{ inputs.include-json }}
        NO_IGNORE: ${{ inputs.no-ignore }}
        CONFIG: ${{ inputs.config }}
        NO_CONFIG: ${{ inputs.no-config }}
        SARIF_FILE: ${{ inputs.sarif-file }}
        FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        FAIL_ON_UNUSED_MARKERS: ${{ inputs.fail-on-unused-markers }}
      run: |
        set -u

        # A boolean input is a string, and `True` or `yes` would otherwise be
        # silently read as false. A scanner that quietly stops enforcing is
        # worse than one that fails, so an unrecognized value is an error.
        boolean() {
          case "$2" in
            true | false) ;;
            *)
              echo "straitjacket action: ${1} must be true or false, got '${2}'" >&2
              exit 2
              ;;
          esac
          [ "$2" = "true" ]
        }

        # A YAML list arrives as a newline-separated string; `--only` and
        # `--skip` want it comma-separated. Both spellings are accepted so the
        # workflow can read the way its author finds clearest.
        commas() {
          printf '%s' "$1" | tr '\n ' ',,' | sed 's/,\{1,\}/,/g; s/^,//; s/,$//'
        }

        # Word splitting is the point: paths are an argument list, and IFS
        # splits on newlines as well as spaces, so a YAML block works too.
        # shellcheck disable=SC2086
        set -- $PATHS

        if [ -n "$ONLY" ]; then set -- "$@" --only "$(commas "$ONLY")"; fi
        if [ -n "$SKIP" ]; then set -- "$@" --skip "$(commas "$SKIP")"; fi
        if [ -n "$FORMAT" ]; then set -- "$@" --format "$FORMAT"; fi
        if [ -n "$MAX_LINES" ]; then set -- "$@" --max-lines "$MAX_LINES"; fi
        if [ -n "$MAX_NESTING" ]; then set -- "$@" --max-nesting "$MAX_NESTING"; fi
        if [ -n "$CONFIG" ]; then set -- "$@" --config "$CONFIG"; fi
        if [ -n "$SARIF_FILE" ]; then set -- "$@" --sarif "$SARIF_FILE"; fi

        if boolean no-comments "$NO_COMMENTS"; then set -- "$@" --no-comments; fi
        if boolean include-json "$INCLUDE_JSON"; then set -- "$@" --include-json; fi
        if boolean no-ignore "$NO_IGNORE"; then set -- "$@" --no-ignore; fi
        if boolean no-config "$NO_CONFIG"; then set -- "$@" --no-config; fi
        if ! boolean fail-on-findings "$FAIL_ON_FINDINGS"; then set -- "$@" --no-fail; fi
        if ! boolean fail-on-unused-markers "$FAIL_ON_UNUSED_MARKERS"; then
          set -- "$@" --no-fail-on-unused-markers
        fi

        straitjacket "$@" && code=0 || code=$?
        echo "exit-code=${code}" >> "$GITHUB_OUTPUT"
        exit "$code"
