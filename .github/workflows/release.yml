name: release

# A tag is the whole trigger. Everything the installer reads — the archives, the
# checksums, and the "latest" pointer — is produced here, so a release is never
# assembled by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build a release for
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # The release is created as a draft and published only after every archive and
  # the checksum file are in place. A draft is not returned by the "latest"
  # endpoint, so `install.sh` can never see a half-uploaded release.
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - name: Check the tag against Cargo.toml
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$TAG" != "v${crate}" ]; then
            echo "tag ${TAG} does not match Cargo.toml version ${crate}" >&2
            exit 1
          fi
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "$TAG" --generate-notes
          fi

  build:
    needs: draft
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      # Both Linux targets cross-compile from an ordinary x86_64 host, because
      # .cargo/config.toml links them with rust-lld against a self-contained
      # musl. No cross toolchain, container, or apt package is involved.
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          stage=$(mktemp -d)
          cp "target/${{ matrix.target }}/release/straitjacket" "$stage/"
          cp README.md LICENSE "$stage/"
          tar -czf "straitjacket-${TAG}-${{ matrix.target }}.tar.gz" -C "$stage" \
            straitjacket README.md LICENSE
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" "straitjacket-${TAG}-${{ matrix.target }}.tar.gz" --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The checksums are computed from what the release actually holds rather
      # than from what each build job believes it uploaded.
      - name: Checksum every archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "$TAG" --pattern '*.tar.gz' --dir assets
          cd assets && sha256sum ./*.tar.gz | sed 's|\./||' > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --draft=false --latest

  # Install the release that was just published, on every supported platform,
  # through both the script and the action. Called rather than triggered: a
  # release published by GITHUB_TOKEN raises no event that starts a workflow.
  smoke:
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/install-smoke.yml
    with:
      version: ${{ inputs.tag || github.ref_name }}

  # Publish the same commit to crates.io, after the binaries have been proven
  # to install and run. crates.io is the one place a version can never be
  # replaced, so it goes last.
  #
  # Authentication is by OIDC: crates.io mints a token that lives under an
  # hour, and the action revokes it when the job ends. There is no registry
  # token stored in this repository, which is the point. crates.io scopes the
  # trust to this repository and this workflow file, so renaming this file
  # breaks publishing until the trusted publisher is updated to match.
  crate:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      # Re-running a release must not fail on a version crates.io already has.
      # A version there is permanent, so republishing is not a thing that can
      # be retried into working.
      - name: Check whether this version is already published
        id: existing
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -A 'straitjacket-release (https://github.com/PowderworksCode/straitjacket)' \
            "https://crates.io/api/v1/crates/straitjacket/${version}")
          if [ "$code" = "200" ]; then
            echo "straitjacket ${version} is already on crates.io; nothing to publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
        if: steps.existing.outputs.published == 'false'
      - run: cargo publish --locked
        if: steps.existing.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
