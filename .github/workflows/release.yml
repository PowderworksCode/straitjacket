name: release

# A tag is the whole trigger. Everything the installer reads — the archives, the
# checksums, and the "latest" pointer — is produced here, so a release is never
# assembled by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build a release for
        required: true

permissions:
  contents: read

# Never run two releases at once, and never cancel one in flight: a cancelled
# `cargo publish` can leave a version uploaded that can never be reused.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # The release is created as a draft and published only after every archive and
  # the checksum file are in place. A draft is not returned by the "latest"
  # endpoint, so `install.sh` can never see a half-uploaded release.
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - name: Check the tag against Cargo.toml
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$TAG" != "v${crate}" ]; then
            echo "tag ${TAG} does not match Cargo.toml version ${crate}" >&2
            exit 1
          fi
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "$TAG" --generate-notes
          fi

  build:
    needs: draft
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      # Both Linux targets cross-compile from an ordinary x86_64 host, because
      # .cargo/config.toml links them with rust-lld against a self-contained
      # musl. No cross toolchain, container, or apt package is involved.
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          stage=$(mktemp -d)
          cp "target/${{ matrix.target }}/release/straitjacket" "$stage/"
          cp README.md LICENSE "$stage/"
          tar -czf "straitjacket-${TAG}-${{ matrix.target }}.tar.gz" -C "$stage" \
            straitjacket README.md LICENSE
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" "straitjacket-${TAG}-${{ matrix.target }}.tar.gz" --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The checksums are computed from what the release actually holds rather
      # than from what each build job believes it uploaded.
      - name: Checksum every archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "$TAG" --pattern '*.tar.gz' --dir assets
          cd assets && sha256sum ./*.tar.gz | sed 's|\./||' > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --draft=false --latest

  # Install the release that was just published, on every supported platform,
  # through both the script and the action. Called rather than triggered: a
  # release published by GITHUB_TOKEN raises no event that starts a workflow.
  smoke:
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/install-smoke.yml
    with:
      version: ${{ inputs.tag || github.ref_name }}

  # Publish the same commit to crates.io, after the binaries have been proven
  # to install and run. crates.io is the one place a version can never be
  # replaced, so it goes last and everything checkable is checked first.
  #
  # The logic lives in scripts/publish.sh so the same path can be run by hand,
  # and so this job is a caller rather than a second definition of it.
  crate:
    needs: smoke
    runs-on: ubuntu-latest
    # One place to require a human approval before an irreversible publish:
    # Settings > Environments > crates-io > Required reviewers.
    environment: crates-io
    permissions:
      id-token: write
    env:
      # `secrets` cannot be read from an `if`, so the question of whether one
      # exists is answered here, where it can.
      HAS_STORED_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      # Trusted publishing is the normal path and needs no secret. The stored
      # token exists only to bootstrap: a crate's first version cannot be
      # published this way, because crates.io will not attach a trusted
      # publisher to a crate that does not exist yet. Delete the secret once
      # the trusted publisher is configured and this step takes over again.
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
        if: env.HAS_STORED_TOKEN == 'false'
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ "${HAS_STORED_TOKEN}" = "true" ]; then
            echo "publishing with the stored bootstrap token; delete it once trusted publishing is configured"
          else
            echo "publishing with a short-lived trusted-publishing token"
          fi
          scripts/publish.sh --execute
