name: install-smoke (rust)

# Proof that the published artifacts work, run against a real release rather
# than a simulation of one.
#
# This is called by the release workflow rather than triggered by
# `release: published`, because an event raised by GITHUB_TOKEN does not start
# another workflow run — a `release` trigger here would never fire at all.
on:
  workflow_call:
    inputs:
      version:
        description: Release tag to install, or `latest`
        required: false
        type: string
        default: latest
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to install, or `latest`
        required: false
        default: latest

permissions:
  contents: read

jobs:
  install-script:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `x && '' || y` yields y in a GitHub expression, because the empty string
      # is falsy, so the version is cleared in the shell instead.
      - name: Install with the published script
        env:
          VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${VERSION}" ] && [ "${VERSION}" != "latest" ]; then
            export STRAITJACKET_VERSION="${VERSION}"
          fi
          sh scripts/install.sh
      - name: The installed binary runs
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          straitjacket --version

