name: CI

on:
  push:
    branches: [main]
  # paths-ignore keeps the heavy Cargo job off pull requests that only touch
  # prose, which is what `ci-scoped` asks for.
  pull_request:
    paths-ignore:
      - "**.md"
      - "notes/**"

# Least privilege. A job that needs to write grants it explicitly.
permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Every CI run contributes this build to the public compile-time census
      # at <https://cratebank.io/>. It builds what the steps below would have
      # built anyway, measured, so what is added here is mostly the measuring.
      #
      # `strict` because this is the build. A measurement that quietly did not
      # happen would mean nothing built the project either, and a green check
      # would be saying so about work that never ran.
      - uses: PowderworksCode/cratebank/action@v0.1.1
        with:
          org-id: powderworks
          strict: "true"

      # The toolchain comes from rust-toolchain.toml, which rustup installs on
      # first use, so no setup action decides the version.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The installer is the first thing a new user runs, and it runs under
      # whatever /bin/sh they have.
      - run: shellcheck -s sh install.sh
      # A release build must keep working between releases, or the breakage is
      # only discovered when a tag is pushed and it is too late to fix quietly.
      - run: rustup target add x86_64-unknown-linux-musl
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      # The publish path runs on every change, uploading nothing. Otherwise it
      # is first exercised by the tag that publishes, which is the one moment
      # a mistake cannot be taken back.
      - run: scripts/publish.sh --dry-run

  # The action manifest is loaded by GitHub, not by cargo, so nothing above
  # would notice a mistake in it. Until this job existed, `action.yml` was
  # first exercised by whoever depended on it -- and a manifest that does not
  # parse fails their build before a single step of ours runs, with an error
  # naming a line in this repository. Same argument as the publish dry run.
  #
  # It fails on findings, because the release smoke test does, and a finding
  # that only surfaces there surfaces after the tag is pushed -- which is
  # exactly what happened to v0.1.2. This job is the same scan, run early
  # enough to be fixable.
  action:
    name: action
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          token: ${{ github.token }}
