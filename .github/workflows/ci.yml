name: CI

on:
  push:
    branches: [main]
  # paths-ignore keeps the heavy Cargo job off pull requests that only touch
  # prose, which is what `ci-scoped` asks for.
  pull_request:
    paths-ignore:
      - "**.md"
      - "notes/**"

# Least privilege. A job that needs to write grants it explicitly.
permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # The toolchain comes from rust-toolchain.toml, which rustup installs on
      # first use, so no setup action decides the version.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
