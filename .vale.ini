# Distributed by Ordnung's `paranoid` tier: edit it there, not here.
#
# proselint and write-good rather than a house style guide: they catch prose
# that is weak on anyone's terms — weasel words, passive constructions,
# clichés, redundancy — without imposing a voice on repositories whose readers
# are each other. A style guide can come later, from writing that exists.
StylesPath = .vale/styles
MinAlertLevel = warning

Packages = proselint, write-good

[*.md]
BasedOnStyles = proselint, write-good

# write-good ships these two at error level and the rest of its style advice at
# warning, which is its packaging rather than a considered position: opening a
# sentence with "There is" is a preference exactly like the passive voice it
# warns about. Levelled down so that prose style informs and does not gate;
# what still fails a build is a real defect, such as a TODO left in a document.
write-good.ThereIs = warning
write-good.So = warning

# Prose lives in sentences; a fenced block is code someone will run. Anchored to
# line starts because the unanchored form silently matched nothing: a fence with
# no language tag was graded as prose, and `[PATHS]...` in a usage block read as
# an ellipsis waiting to be typeset.
BlockIgnores = (?sm)^ *```.*?^ *```

# `vale sync` writes the style packages here, README files and all, and Vale
# then grades the prose of the linters it just downloaded.
[.vale/styles/**]
BasedOnStyles =

# Verbatim text from other projects, reproduced to satisfy their licences.
# proselint asks for `©` where a licence header writes `(c)`, and taking that
# advice would edit somebody else's licence.
[THIRD-PARTY-NOTICES.md]
BasedOnStyles =
