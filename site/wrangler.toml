# Cloudflare Workers config for the straitjacket docs site (static assets only).
#
# The site is a Next.js static export (`output: 'export'` -> ./out), deployed as
# an assets-only Worker with no server code.
#
# Workers Build settings — root directory `site`, build `bun run build`, deploy
# `bun run deploy`. Both go through package.json so wrangler comes from the
# lockfile; `npx wrangler` would fetch whatever is newest at deploy time.
name = "straitjacket"
compatibility_date = "2026-07-01"

[assets]
directory = "./out"
not_found_handling = "404-page"
