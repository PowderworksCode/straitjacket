# Cloudflare Workers config for the straitjacket docs site: plain files from
# powderworks-docs, served as a Worker over static assets. The worker exists
# for one job -- when an agent asks for a page with `Accept: text/markdown`,
# it serves that page's markdown twin (the index.md sitting beside each
# rendered page) instead of the HTML -- which is why `run_worker_first` is
# true: twins sit beside every page, so any path can negotiate. Workers Build
# settings are root directory `site`, build `bun run build`, deploy `bun run
# deploy`; both go through package.json so wrangler comes from the lockfile,
# where `npx wrangler` would fetch whatever is newest at deploy time.
name = "straitjacket"
main = "worker.ts"
compatibility_date = "2026-07-01"

[assets]
directory = "./out"
not_found_handling = "404-page"
binding = "ASSETS"

run_worker_first = true
